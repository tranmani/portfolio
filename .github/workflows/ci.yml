name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Never execute untrusted fork code on the persistent home runner.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, minipc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run check
      - name: Palette contrast and content invariants
        run: npm run test
      - name: Build
        run: npm run build
      - name: Accessibility (axe, light and dark)
        run: node scripts/a11y.mjs
